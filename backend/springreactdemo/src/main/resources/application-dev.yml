spring:
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${MONGODB_URI}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiry-seconds: ${JWT_EXPIRY_SECONDS:900}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    dev-users:
      admin-password: ${DEV_ADMIN_PASSWORD}
      user-password: ${DEV_USER_PASSWORD}
