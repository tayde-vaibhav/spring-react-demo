management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  security:
    login-rate-limiter:
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
