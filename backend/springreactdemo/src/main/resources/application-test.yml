spring:
  data:
    mongodb:
      auto-index-creation: false
# Test-classpath configuration supplies an owned Testcontainers service connection.
# No external database URI or localhost fallback is supported by the test suite.
app:
  security:
    jwt:
      secret: ${JWT_SECRET:test-only-signing-key-do-not-use-outside-tests}
      expiry-seconds: 900
    cors:
      allowed-origins: http://localhost:5173,http://127.0.0.1:5173
