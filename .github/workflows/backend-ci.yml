name: Backend and Frontend CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verify:
    name: Backend tests and JaCoCo
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend/springreactdemo

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/springreactdemo/pom.xml

      - name: Verify Docker availability
        run: docker info --format '{{.ServerVersion}}'

      - name: Run backend tests and JaCoCo checks
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend-verify:
    name: Frontend lint, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run standard ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

  required-ci-gate:
    name: Required CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    needs:
      - backend-verify
      - frontend-verify

    if: ${{ always() }}

    steps:
      - name: Verify all required jobs succeeded
        env:
          BACKEND_RESULT: ${{ needs.backend-verify.result }}
          FRONTEND_RESULT: ${{ needs.frontend-verify.result }}
        run: |
          echo "Backend result: $BACKEND_RESULT"
          echo "Frontend result: $FRONTEND_RESULT"

          if [[ "$BACKEND_RESULT" != "success" ||
                "$FRONTEND_RESULT" != "success" ]]; then
            echo "::error::Required CI validation did not succeed."
            exit 1
          fi

          echo "All required CI validations passed."
